[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "python-code-health-analyzer"
version = "0.1.0"
description = "A dependency-free Python static analyzer for code health, complexity, and import cycles."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Kothapalli" }]
maintainers = [{ name = "Kothapalli Johnvaraprasad" }]
keywords = ["python", "static-analysis", "ast", "code-quality", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Johnkothapalli/python-code-health-analyzer"
Repository = "https://github.com/Johnkothapalli/python-code-health-analyzer"
Issues = "https://github.com/Johnkothapalli/python-code-health-analyzer/issues"
Changelog = "https://github.com/Johnkothapalli/python-code-health-analyzer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "twine>=6.0",
]

[project.scripts]
code-health = "code_health.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_health"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=code_health --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["code_health"]
